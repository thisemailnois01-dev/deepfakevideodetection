<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Deepfake Detector</title>

    <style>

        body{
            margin:0;
            padding:0;
            background:#0f172a;
            font-family:Arial, sans-serif;
            color:white;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{

            width:500px;
            background:#1e293b;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0px 0px 20px rgba(0,0,0,0.4);
        }

        h1{
            margin-bottom:10px;
        }

        p{
            color:#cbd5e1;
        }

        input{

            margin-top:20px;
            width:100%;
            padding:10px;
            background:#334155;
            border:none;
            color:white;
            border-radius:8px;
        }

        button{

            margin-top:20px;
            padding:12px 30px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        #result{

            margin-top:30px;
            font-size:22px;
        }

        .loading{
            color:yellow;
        }

        .real{
            color:#22c55e;
        }

        .fake{
            color:#ef4444;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Deepfake Video Detector</h1>

        <p>
            Upload a video and AI will predict whether it is REAL or FAKE
        </p>

        <input type="file" id="videoInput" accept="video/*">

        <button onclick="uploadVideo()">
            Predict Video
        </button>

        <div id="result"></div>

    </div>

    <script>

        async function uploadVideo(){

            const fileInput =
                document.getElementById("videoInput");

            const file = fileInput.files[0];

            if(!file){

                alert("Please select a video");
                return;
            }

            const formData = new FormData();

            formData.append("video", file);

            document.getElementById("result").innerHTML =
                "<p class='loading'>Processing video...</p>";

            try{

                const response = await fetch("/predict",{

                    method:"POST",
                    body:formData
                });

                const data = await response.json();

                let className =
                    data.prediction === "REAL"
                    ? "real"
                    : "fake";

                document.getElementById("result").innerHTML = `

                    <h2 class="${className}">
                        ${data.prediction}
                    </h2>

                    <p>
                        Confidence:
                        <b>${data.confidence}%</b>
                    </p>

                `;

            }catch(error){

                document.getElementById("result").innerHTML =

                    "<p class='fake'>Error processing video</p>";
            }
        }

    </script>

</body>

</html>
